<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>どんぐりのファイル共有-アップローダー</title>
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(
                    180deg,
                    #007bff 0%,
                    #007bff 75%,
                    #28a745 85%,
                    #28a745 100%
                );
                min-height: 100vh;
                padding: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow-x: hidden;
                overflow-y: auto;
            }

            /* 雲の全体コンテナ */
            .clouds {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 200px;
                pointer-events: none;
                overflow: hidden;
                z-index: 0;
            }

            /* 雲の共通スタイル */
            .cloud {
                position: absolute;
                top: 20px;
                left: 0;
                width: 150px;
                height: 80px;
                border-radius: 50px;
                background: rgba(255, 255, 255, 0.92);
                filter: blur(0.7px);
                opacity: 0.85;
                --scale: 1;
                transform: scale(var(--scale));
            }

            /* 雲の形（モコモコ） */
            .cloud::before,
            .cloud::after {
                content: "";
                position: absolute;
                background: white;
                width: 80px;
                height: 50px;
                border-radius: 50%;
            }

            .cloud::before {
                top: -20px;
                left: 20px;
            }

            .cloud::after {
                top: 10px;
                left: 60px;
            }

            /* 雲アニメーションは停止（ランダム配置のみ） */

            .container {
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                max-width: 600px;
                width: 100%;
                padding: 40px;
                position: relative;
                z-index: 1;
            }

            h1 {
                color: #333;
                margin-bottom: 10px;
                text-align: center;
            }

            .subtitle {
                color: #999;
                text-align: center;
                margin-bottom: 30px;
                font-size: 14px;
            }

            .ip-info {
                text-align: center;
                color: #999;
                font-size: 12px;
                margin-bottom: 30px;
                padding: 10px;
                background: #f9f9f9;
                border-radius: 6px;
            }

            .ip-info strong {
                color: #667eea;
            }

            .section h2 {
                color: #667eea;
                margin-bottom: 20px;
                font-size: 20px;
                border-bottom: 2px solid #667eea;
                padding-bottom: 10px;
            }

            /* Upload Section */
            .upload-area {
                border: 3px dashed #667eea;
                border-radius: 8px;
                padding: 40px;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s ease;
                background: #f8f9ff;
            }

            .upload-area:hover {
                background: #f0f2ff;
                border-color: #764ba2;
            }

            .upload-area.dragover {
                background: #e8ebff;
                border-color: #764ba2;
            }

            .upload-icon {
                font-size: 48px;
                margin-bottom: 15px;
            }

            .upload-text {
                color: #333;
                font-weight: 600;
                margin-bottom: 5px;
            }

            .upload-subtext {
                color: #999;
                font-size: 12px;
                margin-bottom: 15px;
            }

            #fileInput {
                display: none;
            }

            .upload-button {
                background: #667eea;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .upload-button:hover {
                background: #764ba2;
            }

            .queue-container {
                margin-top: 24px;
                background: #f8f9ff;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .queue-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-bottom: 12px;
            }

            .queue-title {
                font-weight: 700;
                color: #333;
                font-size: 16px;
            }

            .queue-hint {
                color: #777;
                font-size: 12px;
            }

            .queue-count {
                background: #667eea;
                color: white;
                padding: 6px 12px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 700;
                min-width: 48px;
                text-align: center;
            }

            .queue-list {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .queue-empty {
                text-align: center;
                color: #888;
                font-size: 12px;
                padding: 14px 10px;
                border: 1px dashed #d5d9ff;
                border-radius: 8px;
                background: #fff;
            }

            .queue-item {
                border: 1px solid #e5e7eb;
                border-left: 4px solid #667eea;
                border-radius: 10px;
                padding: 12px;
                background: white;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
                transition:
                    transform 0.15s ease,
                    border-color 0.2s ease;
            }

            .queue-item:hover {
                transform: translateY(-2px);
            }

            .queue-item.success {
                border-left-color: #28a745;
            }

            .queue-item.error {
                border-left-color: #dc3545;
            }

            .queue-item.canceled {
                border-left-color: #999;
                opacity: 0.85;
            }

            .queue-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }

            .queue-meta {
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
            }

            .file-name {
                font-weight: 700;
                color: #333;
                word-break: break-all;
            }

            .file-size {
                color: #666;
                font-size: 12px;
            }

            .file-status {
                font-size: 12px;
                color: #666;
            }

            .queue-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .queue-actions .cancel-button,
            .queue-actions .download-button {
                padding: 6px 12px;
                font-size: 12px;
            }

            .copy-all-button {
                background: linear-gradient(135deg, #667eea, #5a67d8);
                border: none;
                font-weight: 700;
                letter-spacing: 0.2px;
                padding: 10px 16px;
                box-shadow: 0 6px 18px rgba(102, 126, 234, 0.35);
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .copy-all-button:hover:not(:disabled) {
                background: linear-gradient(135deg, #5a67d8, #4c51bf);
                box-shadow: 0 8px 22px rgba(90, 103, 216, 0.45);
            }

            .copy-all-button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                box-shadow: none;
                filter: saturate(0.9);
            }

            .share-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: flex-end;
                align-items: center;
            }

            .zip-button {
                background: linear-gradient(135deg, #2dce89, #38a169);
                border: none;
                font-weight: 700;
                letter-spacing: 0.2px;
                padding: 10px 16px;
                box-shadow: 0 6px 18px rgba(56, 161, 105, 0.35);
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .zip-button:hover:not(:disabled) {
                background: linear-gradient(135deg, #2f855a, #276749);
                box-shadow: 0 8px 22px rgba(56, 161, 105, 0.45);
            }

            .zip-button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                box-shadow: none;
                filter: saturate(0.9);
            }

            .share-panel {
                margin-top: 16px;
                padding: 14px 16px;
                background: #fff;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
                flex-wrap: wrap;
            }

            .share-title {
                font-weight: 700;
                color: #333;
            }

            .share-hint {
                color: #666;
                font-size: 12px;
                margin-top: 4px;
            }

            .copy-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 26px;
                height: 22px;
                padding: 0 8px;
                margin-left: 8px;
                background: rgba(255, 255, 255, 0.2);
                border-radius: 999px;
                font-size: 12px;
                font-weight: 700;
            }

            .share-links {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 10px;
                margin-bottom: 6px;
            }

            .share-link {
                background: #fff;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                padding: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .share-link a {
                word-break: break-all;
                font-size: 12px;
                color: #1f3bb3;
                line-height: 1.4;
                text-decoration: none;
            }

            .share-link a:hover {
                text-decoration: underline;
            }

            .share-link .download-button {
                flex-shrink: 0;
            }

            .share-link-anchor {
                word-break: break-all;
                color: #1f3bb3;
                text-decoration: none;
            }

            .share-link-anchor:hover {
                text-decoration: underline;
            }

            .queue-link-box {
                display: none !important;
            }

            .queue-item .progress-bar {
                margin-top: 10px;
            }

            .queue-item .progress-text {
                margin-top: 6px;
            }

            .progress-container {
                margin-top: 20px;
                display: none;
            }

            .progress-bar {
                width: 100%;
                height: 8px;
                background: #eee;
                border-radius: 4px;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #667eea, #764ba2);
                width: 0%;
                transition: width 0.3s ease;
            }

            .progress-text {
                font-size: 12px;
                color: #999;
                margin-top: 5px;
            }

            .progress-actions {
                margin-top: 12px;
                display: flex;
                justify-content: flex-end;
            }

            .cancel-button {
                background: transparent;
                border: 1px solid #dc3545;
                color: #dc3545;
                border-radius: 6px;
                padding: 6px 14px;
                font-size: 13px;
                cursor: pointer;
                transition:
                    background 0.2s ease,
                    color 0.2s ease;
            }

            .cancel-button:hover:not(:disabled) {
                background: rgba(220, 53, 69, 0.08);
            }

            .cancel-button:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .upload-result {
                margin-top: 20px;
                padding: 15px;
                border-radius: 6px;
                display: none;
            }

            .upload-result.success {
                background: #d4edda;
                border: 1px solid #c3e6cb;
                color: #155724;
            }

            .upload-result.error {
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
            }

            .download-url {
                background: white;
                padding: 12px;
                border-radius: 4px;
                margin-top: 10px;
                word-break: break-all;
                font-family: monospace;
                font-size: 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .download-button {
                background: #667eea;
                color: white;
                border: none;
                padding: 6px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 12px;
                margin-left: 10px;
                flex-shrink: 0;
            }

            .download-button:hover {
                background: #764ba2;
            }

            .error-message {
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 20px;
            }

            .success-message {
                background: #d4edda;
                border: 1px solid #c3e6cb;
                color: #155724;
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 20px;
            }

            .preview-container {
                margin-top: 20px;
                display: none;
                border: 1px solid #ddd;
                border-radius: 6px;
                overflow: hidden;
                background: #f9f9f9;
            }

            .preview-header {
                background: #667eea;
                color: white;
                padding: 10px;
                font-weight: 600;
                font-size: 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .preview-close {
                background: none;
                border: none;
                color: white;
                cursor: pointer;
                font-size: 16px;
            }

            .preview-body {
                padding: 10px;
                max-height: 300px;
                overflow-y: auto;
            }

            .preview-image {
                max-width: 100%;
                max-height: 300px;
                display: block;
                margin: 0 auto;
            }

            .preview-text {
                white-space: pre-wrap;
                word-wrap: break-word;
                font-family: monospace;
                font-size: 12px;
                line-height: 1.5;
                color: #333;
            }

            .preview-unavailable {
                text-align: center;
                color: #999;
                padding: 30px;
                font-size: 12px;
            }

            .preview-video {
                width: 100%;
                max-height: 300px;
            }

            .preview-audio {
                width: 100%;
                margin: 10px 0;
            }

            .preview-play-button {
                background: #667eea;
                color: #fff;
                border: none;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
                transition: background 0.2s ease;
            }

            .preview-play-button:hover {
                background: #764ba2;
            }
        </style>
    </head>
    <body>
        <div class="clouds" id="cloudLayer"></div>
        <div class="container">
            <h1>📤 ファイル共有</h1>
            <p class="subtitle">
                最大 5GB までのファイルをアップロードして共有できます
            </p>
            <!-- IP display removed -->

            <div id="errorContainer"></div>
            <div id="successContainer"></div>

            <div class="section">
                <h2>アップロード</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">
                        ファイルをまとめてドラッグ＆ドロップ
                    </div>
                    <button class="upload-button" id="selectButton">
                        ファイルを選択
                    </button>
                    <input type="file" id="fileInput" multiple />
                </div>
                <div class="queue-container">
                    <div class="queue-header">
                        <div>
                            <div class="queue-title">アップロードキュー</div>
                            <div class="queue-hint">
                                複数ファイルを一度に追加できます
                            </div>
                        </div>
                        <div class="queue-count" id="queueCount">0件</div>
                    </div>
                    <div class="share-panel" id="sharePanel">
                        <div>
                            <div class="share-title">共有リンク</div>
                            <div class="share-hint" id="shareHint">
                                アップロード完了後にここへリンクが並びます
                            </div>
                        </div>
                        <div class="share-actions">
                            <button
                                class="download-button copy-all-button"
                                id="openBatchButton"
                                type="button"
                                disabled
                            >
                                🔗 まとめページを開く
                                <span class="copy-badge" id="copyCountBadge"
                                    >0</span
                                >
                            </button>
                            <button
                                class="download-button zip-button"
                                id="downloadAllButton"
                                type="button"
                                disabled
                            >
                                📦 ZIP でダウンロード
                                <span class="copy-badge" id="zipCountBadge"
                                    >0</span
                                >
                            </button>
                        </div>
                    </div>
                    <div class="share-links" id="shareLinks"></div>
                    <div class="queue-list" id="queueList">
                        <div class="queue-empty" id="queueEmpty">
                            まだファイルが選択されていません
                        </div>
                    </div>
                </div>
                <div class="preview-container" id="previewContainer">
                    <div class="preview-header">
                        プレビュー
                        <button class="preview-close" onclick="closePreview()">
                            ✕
                        </button>
                    </div>
                    <div class="preview-body" id="previewBody"></div>
                </div>
            </div>
        </div>

        <script>
            const API_BASE = "/api";
            const cloudLayer = document.getElementById("cloudLayer");

            if (cloudLayer) {
                const CLOUD_COUNT = 7;

                const randomizeCloud = (cloud) => {
                    const scale = (0.6 + Math.random() * 0.9).toFixed(2);
                    const top = 10 + Math.random() * 130;
                    const left = -10 + Math.random() * 120;

                    cloud.style.setProperty("--scale", scale);
                    cloud.style.top = `${top}px`;
                    cloud.style.left = `${left}%`;
                    cloud.style.transform = `scale(${scale})`;
                };

                Array.from({ length: CLOUD_COUNT }).forEach(() => {
                    const cloud = document.createElement("div");
                    cloud.className = "cloud";
                    randomizeCloud(cloud);
                    cloudLayer.appendChild(cloud);
                });
            }

            const uploadArea = document.getElementById("uploadArea");
            const fileInput = document.getElementById("fileInput");
            const selectButton = document.getElementById("selectButton");
            const openBatchButton = document.getElementById("openBatchButton");
            const downloadAllButton =
                document.getElementById("downloadAllButton");
            const errorContainer = document.getElementById("errorContainer");
            const successContainer =
                document.getElementById("successContainer");
            const queueList = document.getElementById("queueList");
            const queueEmpty = document.getElementById("queueEmpty");
            const queueCount = document.getElementById("queueCount");
            const shareLinks = document.getElementById("shareLinks");
            const shareHint = document.getElementById("shareHint");
            const copyCountBadge = document.getElementById("copyCountBadge");
            const zipCountBadge = document.getElementById("zipCountBadge");

            const uploadQueue = [];
            const STATE_CLASSES = [
                "pending",
                "uploading",
                "success",
                "error",
                "canceled",
            ];
            let currentUploadItem = null;

            const formatBytes = (bytes) => {
                if (!bytes || bytes <= 0) return "0 B";
                const units = ["B", "KB", "MB", "GB", "TB"];
                const exponent = Math.min(
                    Math.floor(Math.log(bytes) / Math.log(1024)),
                    units.length - 1,
                );
                const value = bytes / 1024 ** exponent;
                const rounded = value.toFixed(
                    value >= 10 || exponent === 0 ? 0 : 1,
                );
                return `${rounded} ${units[exponent]}`;
            };

            const readyLinks = () =>
                uploadQueue
                    .filter(
                        (item) =>
                            item.state === "success" &&
                            item.linkAnchor.textContent.trim() &&
                            item.linkAnchor.href &&
                            !item.linkAnchor.href.endsWith("#"),
                    )
                    .map((item) => item.linkAnchor.href.trim())
                    .filter(Boolean);

            const readyTokens = () => {
                const seen = new Set();
                return uploadQueue
                    .filter((item) => item.state === "success" && item.token)
                    .map((item) => item.token)
                    .filter((token) => {
                        if (seen.has(token)) return false;
                        seen.add(token);
                        return true;
                    });
            };

            const renderShareArea = () => {
                if (!shareLinks || !shareHint) return;
                shareLinks.innerHTML = "";
                const links = readyLinks();
                const tokens = readyTokens();

                if (openBatchButton) {
                    openBatchButton.disabled = tokens.length === 0;
                    openBatchButton.title = tokens.length
                        ? "まとめダウンロードページを開く"
                        : "アップロード完了後に利用できます";
                }
                if (copyCountBadge) {
                    copyCountBadge.textContent = tokens.length.toString();
                }
                if (downloadAllButton) {
                    downloadAllButton.disabled = tokens.length === 0;
                    downloadAllButton.title = tokens.length
                        ? "アップロード済みのファイルをまとめてダウンロード"
                        : "アップロード完了後に利用できます";
                }
                if (zipCountBadge) {
                    zipCountBadge.textContent = tokens.length.toString();
                }

                if (!links.length) {
                    shareHint.textContent =
                        "アップロード完了後にここへリンクが並びます";
                    return;
                }

                shareHint.textContent = `${links.length}件のリンクをまとめて確認 / ZIPダウンロードできます`;
                links.forEach((url) => {
                    const row = document.createElement("div");
                    row.className = "share-link";
                    const anchor = document.createElement("a");
                    anchor.href = url;
                    anchor.target = "_blank";
                    anchor.rel = "noopener";
                    anchor.textContent = url;
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "download-button";
                    btn.textContent = "コピー";
                    btn.dataset.url = url;
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        copyUrlToClipboard(btn);
                    });
                    row.append(anchor, btn);
                    shareLinks.appendChild(row);
                });
            };

            renderShareArea();

            const updateQueueMeta = () => {
                const hasItem =
                    queueList && queueList.querySelector(".queue-item");
                if (queueEmpty) {
                    queueEmpty.style.display = hasItem ? "none" : "block";
                }
                if (queueCount) {
                    const total = queueList
                        ? Array.from(
                              queueList.querySelectorAll(".queue-item"),
                          ).filter((el) => !el.classList.contains("canceled"))
                              .length
                        : 0;
                    queueCount.textContent = `${total}件`;
                }
                renderShareArea();
            };

            const setState = (item, state, text) => {
                STATE_CLASSES.forEach((cls) =>
                    item.element.classList.remove(cls),
                );
                item.element.classList.add(state);
                item.state = state;
                if (text) {
                    item.statusText.textContent = text;
                }
                item.cancelButton.disabled = [
                    "success",
                    "error",
                    "canceled",
                ].includes(state);
            };

            const createQueueItem = (file) => {
                const container = document.createElement("div");
                container.className = "queue-item pending";

                const row = document.createElement("div");
                row.className = "queue-row";

                const meta = document.createElement("div");
                meta.className = "queue-meta";

                const name = document.createElement("div");
                name.className = "file-name";
                name.textContent = file.name;

                const size = document.createElement("div");
                size.className = "file-size";
                size.textContent = formatBytes(file.size);

                meta.appendChild(name);
                meta.appendChild(size);

                const actions = document.createElement("div");
                actions.className = "queue-actions";

                const previewBtn = document.createElement("button");
                previewBtn.type = "button";
                previewBtn.className = "download-button";
                previewBtn.textContent = "プレビュー";

                const cancelBtn = document.createElement("button");
                cancelBtn.type = "button";
                cancelBtn.className = "cancel-button";
                cancelBtn.textContent = "キャンセル";

                actions.appendChild(previewBtn);
                actions.appendChild(cancelBtn);

                row.appendChild(meta);
                row.appendChild(actions);

                const progressBar = document.createElement("div");
                progressBar.className = "progress-bar";
                const progressFill = document.createElement("div");
                progressFill.className = "progress-fill";
                progressBar.appendChild(progressFill);

                const statusRow = document.createElement("div");
                statusRow.className = "queue-row";
                const statusText = document.createElement("div");
                statusText.className = "file-status progress-text";
                statusText.textContent = "待機中";
                statusRow.appendChild(statusText);

                const linkBox = document.createElement("div");
                linkBox.className = "download-url queue-link-box";
                const linkAnchor = document.createElement("a");
                linkAnchor.href = "#";
                linkAnchor.target = "_blank";
                linkAnchor.rel = "noopener";
                linkAnchor.textContent = "";
                linkAnchor.className = "share-link-anchor";
                const copyButton = document.createElement("button");
                copyButton.type = "button";
                copyButton.className = "download-button";
                copyButton.textContent = "コピー";
                copyButton.addEventListener("click", (e) => {
                    e.stopPropagation();
                    copyUrlToClipboard(copyButton);
                });
                linkAnchor.addEventListener("click", (e) => {
                    e.stopPropagation();
                });
                linkBox.appendChild(linkAnchor);
                linkBox.appendChild(copyButton);

                const item = {
                    file,
                    element: container,
                    progressFill,
                    statusText,
                    linkBox,
                    linkAnchor,
                    copyButton,
                    token: null,
                    cancelButton: cancelBtn,
                    state: "pending",
                    xhr: null,
                };

                previewBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    showPreview(file);
                });

                cancelBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    cancelUpload(item);
                });

                container.appendChild(row);
                container.appendChild(progressBar);
                container.appendChild(statusRow);
                container.appendChild(linkBox);

                return item;
            };

            const startNextUpload = () => {
                if (currentUploadItem) return;
                const next = uploadQueue.find(
                    (entry) => entry.state === "pending",
                );
                if (!next) return;
                uploadFile(next);
            };

            const cancelUpload = (item) => {
                if (["success", "error", "canceled"].includes(item.state)) {
                    return;
                }
                setState(item, "canceled", "アップロードをキャンセルしました");
                if (item === currentUploadItem && item.xhr) {
                    item.xhr.abort();
                    item.xhr = null;
                    currentUploadItem = null;
                    startNextUpload();
                    return;
                }
                updateQueueMeta();
                startNextUpload();
            };

            const uploadFile = (item) => {
                const formData = new FormData();
                formData.append("file", item.file);

                item.progressFill.style.width = "0%";
                item.linkBox.style.display = "none";
                item.linkAnchor.textContent = "";
                item.linkAnchor.href = "#";
                item.copyButton.dataset.url = "";

                setState(item, "uploading", "アップロード中...");
                currentUploadItem = item;

                const xhr = new XMLHttpRequest();
                item.xhr = xhr;

                xhr.upload.addEventListener("progress", (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        item.progressFill.style.width = `${percent}%`;
                        item.statusText.textContent = `アップロード中... ${percent}%`;
                    }
                });

                xhr.addEventListener("load", () => {
                    let response = {};
                    try {
                        response = JSON.parse(xhr.responseText || "{}");
                    } catch (e) {
                        response = {};
                    }
                    if (xhr.status === 200 && response.url) {
                        item.progressFill.style.width = "100%";
                        setState(item, "success", "アップロード完了");
                        item.linkAnchor.textContent = response.url;
                        item.linkAnchor.href = response.url;
                        item.copyButton.dataset.url = response.url;
                        item.token = response.token;
                        showSuccess(
                            `「${item.file.name}」をアップロードしました`,
                        );
                    } else {
                        const message =
                            response.error || `アップロード失敗: ${xhr.status}`;
                        setState(item, "error", message);
                        showError(message);
                    }
                });

                xhr.addEventListener("error", () => {
                    setState(item, "error", "ネットワークエラーが発生しました");
                    showError("ネットワークエラーが発生しました");
                });

                xhr.addEventListener("abort", () => {
                    setState(
                        item,
                        "canceled",
                        "アップロードをキャンセルしました",
                    );
                });

                xhr.addEventListener("loadend", () => {
                    if (item === currentUploadItem) {
                        currentUploadItem = null;
                    }
                    item.xhr = null;
                    updateQueueMeta();
                    startNextUpload();
                });

                xhr.open("POST", API_BASE + "/upload");
                xhr.send(formData);
            };

            const addFiles = (fileList) => {
                const files = Array.from(fileList || []);
                if (!files.length) return;
                files.forEach((file, index) => {
                    const item = createQueueItem(file);
                    uploadQueue.push(item);
                    queueList.appendChild(item.element);
                    if (files.length === 1 && index === 0) {
                        showPreview(file);
                    }
                });
                updateQueueMeta();
                startNextUpload();
                fileInput.value = "";
            };

            // Event listeners for file selection
            selectButton.addEventListener("click", () => fileInput.click());
            fileInput.addEventListener("change", () =>
                addFiles(fileInput.files),
            );

            openBatchButton?.addEventListener("click", () => {
                const tokens = readyTokens();
                if (!tokens.length) {
                    showError("まとめてダウンロードできるファイルがありません");
                    return;
                }
                const params = new URLSearchParams();
                params.set("tokens", tokens.join(","));
                const url = `${window.location.origin}/batch?${params.toString()}`;
                window.open(url, "_blank", "noopener");
                showSuccess("まとめページを開きます");
            });

            downloadAllButton?.addEventListener("click", async () => {
                const tokens = readyTokens();
                if (!tokens.length) {
                    showError("まとめてダウンロードできるファイルがありません");
                    return;
                }
                downloadAllButton.disabled = true;
                try {
                    const response = await fetch(API_BASE + "/download/zip", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ tokens }),
                    });
                    if (!response.ok) {
                        let message = "ZIPの作成に失敗しました";
                        try {
                            const data = await response.json();
                            message = data.error || message;
                        } catch (e) {
                            const text = await response.text();
                            if (text) message = text;
                        }
                        showError(message);
                        return;
                    }
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download =
                        tokens.length === 1
                            ? "download.zip"
                            : `download-${tokens.length}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    showSuccess("ZIP をダウンロードしました");
                } catch (err) {
                    showError("ZIPのダウンロード中にエラーが発生しました");
                } finally {
                    downloadAllButton.disabled = false;
                }
            });

            // Drag and drop events
            uploadArea.addEventListener("dragover", (e) => {
                e.preventDefault();
                uploadArea.classList.add("dragover");
            });

            uploadArea.addEventListener("dragleave", () => {
                uploadArea.classList.remove("dragover");
            });

            uploadArea.addEventListener("drop", (e) => {
                e.preventDefault();
                uploadArea.classList.remove("dragover");
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    addFiles(files);
                }
            });

            function showError(message) {
                errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
                setTimeout(() => {
                    errorContainer.innerHTML = "";
                }, 5000);
            }

            function showSuccess(message) {
                successContainer.innerHTML = `<div class="success-message">${message}</div>`;
                setTimeout(() => {
                    successContainer.innerHTML = "";
                }, 5000);
            }

            function copyToClipboard(text) {
                navigator.clipboard
                    .writeText(text)
                    .then(() => {
                        showSuccess("リンクをコピーしました");
                    })
                    .catch(() => {
                        alert("コピーに失敗しました");
                    });
            }

            function copyUrlToClipboard(button) {
                const url =
                    button.dataset.url ||
                    button.previousElementSibling.textContent;
                if (!url) return;

                // Try modern Clipboard API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard
                        .writeText(url)
                        .then(() => {
                            const originalText = button.textContent;
                            button.textContent = "コピー済み";
                            button.style.background = "#28a745";
                            setTimeout(() => {
                                button.textContent = originalText;
                                button.style.background = "#667eea";
                            }, 2000);
                            showSuccess("リンクをコピーしました");
                        })
                        .catch(() => {
                            // Fallback to legacy execCommand method
                            legacyCopy(url, button);
                        });
                } else {
                    legacyCopy(url, button);
                }
            }

            function legacyCopy(text, button) {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.select();
                try {
                    const ok = document.execCommand("copy");
                    if (ok) {
                        const originalText = button.textContent;
                        button.textContent = "コピー済み";
                        button.style.background = "#28a745";
                        setTimeout(() => {
                            button.textContent = originalText;
                            button.style.background = "#667eea";
                        }, 2000);
                        showSuccess("リンクをコピーしました");
                    } else {
                        alert("コピーに失敗しました");
                    }
                } catch (e) {
                    alert("コピーに失敗しました");
                }
                document.body.removeChild(ta);
            }

            function closePreview() {
                document.getElementById("previewContainer").style.display =
                    "none";
            }

            function showPreview(file) {
                const previewContainer =
                    document.getElementById("previewContainer");
                const previewBody = document.getElementById("previewBody");
                const fileType = file.type;
                const fileName = file.name;

                previewBody.innerHTML = "";

                // Image preview
                if (fileType.startsWith("image/")) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement("img");
                        img.src = e.target.result;
                        img.className = "preview-image";
                        previewBody.appendChild(img);
                    };
                    reader.readAsDataURL(file);
                    previewContainer.style.display = "block";
                    return;
                }

                // Video preview (MP4, WebM, Ogg)
                if (
                    fileType.startsWith("video/") ||
                    ["mp4", "webm", "ogv"].some((ext) =>
                        fileName.toLowerCase().endsWith(ext),
                    )
                ) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const video = document.createElement("video");
                        video.src = e.target.result;
                        video.className = "preview-video";
                        video.controls = true;
                        previewBody.appendChild(video);
                    };
                    reader.readAsDataURL(file);
                    previewContainer.style.display = "block";
                    return;
                }

                // Audio preview (MP3, WAV, OGG, etc.)
                if (
                    fileType.startsWith("audio/") ||
                    ["mp3", "wav", "ogg", "m4a"].some((ext) =>
                        fileName.toLowerCase().endsWith(ext),
                    )
                ) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const audio = document.createElement("audio");
                        audio.src = e.target.result;
                        audio.className = "preview-audio";
                        audio.controls = true;

                        const playButton = document.createElement("button");
                        playButton.type = "button";
                        playButton.className = "preview-play-button";
                        playButton.textContent = "▶ 再生";
                        playButton.addEventListener("click", () => {
                            if (audio.paused) {
                                audio.play();
                                playButton.textContent = "⏸ 停止";
                            } else {
                                audio.pause();
                                playButton.textContent = "▶ 再生";
                            }
                        });
                        audio.addEventListener("ended", () => {
                            playButton.textContent = "▶ 再生";
                        });

                        previewBody.appendChild(audio);
                        previewBody.appendChild(playButton);
                    };
                    reader.readAsDataURL(file);
                    previewContainer.style.display = "block";
                    return;
                }

                // Text preview
                if (
                    fileType.startsWith("text/") ||
                    fileType === "application/json"
                ) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const pre = document.createElement("div");
                        pre.className = "preview-text";
                        pre.textContent = e.target.result.substring(0, 5000);
                        if (e.target.result.length > 5000) {
                            pre.textContent +=
                                "\n\n... (残り " +
                                (e.target.result.length - 5000) +
                                " 文字は省略されています)";
                        }
                        previewBody.appendChild(pre);
                    };
                    reader.readAsText(file);
                    previewContainer.style.display = "block";
                    return;
                }

                // PDF preview (embed)
                if (fileType === "application/pdf") {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const embed = document.createElement("iframe");
                        embed.src = e.target.result;
                        embed.style.width = "100%";
                        embed.style.height = "300px";
                        embed.style.border = "none";
                        previewBody.appendChild(embed);
                    };
                    reader.readAsDataURL(file);
                    previewContainer.style.display = "block";
                    return;
                }

                // No preview available
                const notAvailable = document.createElement("div");
                notAvailable.className = "preview-unavailable";
                notAvailable.textContent = `このファイル形式 (${fileType || "unknown"}) はプレビューできません`;
                previewBody.appendChild(notAvailable);
                previewContainer.style.display = "block";
            }

            // IP retrieval removed (no IP display)
        </script>
    </body>
</html>
